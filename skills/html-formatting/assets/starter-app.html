<!-- Archetype: app-shell. Fixed sidebar + fluid main, full-viewport, no page scroll;
     the data region scrolls internally. Body fragment — apply_theme.py wraps it with
     the canonical head + footer (the footer sits inside the sidebar for this archetype).
     Tokens: __TITLE__, __EYEBROW__. -->
<div class="app">
  <aside class="sidebar">
    <div class="brandhead">
      <span class="eyebrow brand">__EYEBROW__ · Ersilia Open Source Initiative</span>
      <h1 class="wordmark">__TITLE__</h1>
    </div>
    <p class="wip" style="margin-top:12px;" title="Prototype — data are provisional and will change.">Work in progress · prototype</p>

    <div class="section">
      <h2>Controls</h2>
      <div style="display:flex; flex-wrap:wrap; gap:6px;">
        <button class="chip active">All</button>
        <button class="chip">Filter A</button>
        <button class="chip">Filter B</button>
      </div>
    </div>

    <footer class="credit" style="margin-top:auto;">
      Brought to you by the <a href="https://ersilia.io" target="_blank" rel="noopener">Ersilia Open Source Initiative</a>.
    </footer>
  </aside>

  <main class="main">
    <div class="toolbar" style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
      <span class="eyebrow">Results</span>
      <span class="muted mono" style="margin-left:auto;">3 / 3</span>
      <button class="primary">Export</button>
    </div>
    <div class="scrollwrap card" style="padding:0;">
      <table class="data">
        <thead><tr><th>Name</th><th class="num">Score</th><th>Status</th></tr></thead>
        <tbody>
          <tr><td class="gene">geneA</td><td class="num">0.91</td><td><span class="badge good">high</span></td></tr>
          <tr><td class="gene">geneB</td><td class="num">0.55</td><td><span class="badge" style="--c:var(--amber)">mid</span></td></tr>
          <tr><td class="gene">geneC</td><td class="num">0.12</td><td><span class="badge bad">low</span></td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
