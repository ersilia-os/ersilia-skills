<!-- Archetype: document / report. Centered single column, generous whitespace.
     Body fragment — apply_theme.py wraps it with the canonical head + footer.
     Tokens: __TITLE__, __EYEBROW__, __LEDE__. -->
<main class="document">
  <header class="brandhead">
    <span class="eyebrow brand">__EYEBROW__ · Ersilia Open Source Initiative</span>
    <h1 class="wordmark">__TITLE__</h1>
    <p class="muted" style="margin:.4em 0 0; max-width:62ch;">__LEDE__</p>
  </header>

  <section class="section">
    <h2>Overview</h2>
    <p>Lead with the takeaway. Keep prose tight — one idea per paragraph, numbers in
      <span class="mono">mono</span>. Push detail into tables, tuck methodology behind a link.</p>
  </section>

  <section class="section">
    <h2>Results</h2>
    <table class="data">
      <thead><tr><th>Item</th><th class="num">Value</th><th>Note</th></tr></thead>
      <tbody>
        <tr><td>Example row</td><td class="num">0.82</td><td><span class="badge good">pass</span></td></tr>
        <tr><td>Another</td><td class="num">0.41</td><td><span class="badge warn">check</span></td></tr>
      </tbody>
    </table>
  </section>
</main>
